[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-guard"
version = "0.1.0"
description = "Intrinsic Uncertainty Quantification and Deterministic Verification for Real-Time RAG Hallucination Detection"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Aayush Rawat", email = "aayushrawat540@gmail.com" },
    { name = "Kalidas Marndi" },
    { name = "Abhishek" },
]
keywords = [
    "rag",
    "hallucination-detection",
    "vllm",
    "uncertainty-quantification",
    "guardrail",
    "llm-evaluation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20.0",
    "spacy>=3.5.0",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
calibration = [
    "scikit-learn>=1.0.0",
    "pandas>=1.4.0",
    "datasets>=2.14.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
